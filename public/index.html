<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARROW ARENA · 3 PLAYER BATTLE</title><style>*{box-sizing:border-box}body{margin:0;background:#101b1c;color:#e8f7d1;font-family:monospace;text-align:center}header{padding:20px 12px 8px}h1{margin:0;color:#c7f56c;font-size:clamp(25px,5vw,42px);letter-spacing:4px}p{color:#b3c6b0}.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px}input,button{font:inherit;padding:10px;border:2px solid #b7df79;border-radius:5px;background:#233b36;color:#e7ffb9}button{cursor:pointer;background:#a7d762;color:#15251d;font-weight:bold}button:hover{background:#d3fc89}#status{color:#f8dc8c}canvas{display:block;width:min(96vw,900px);aspect-ratio:900/560;margin:12px auto;background:#2e4a37;border:7px solid #a1c46d;image-rendering:pixelated;touch-action:none}#score{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}#score span{padding:10px;background:#23352f;border:1px solid #55785b}.controls{display:flex;justify-content:space-between;max-width:900px;margin:auto;padding:10px 30px;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,55px);gap:4px}.pad button{height:48px}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3;grid-row:2}#shoot{width:100px;height:100px;border-radius:50%;align-self:center;background:#ffbb66}@media(min-width:850px){.controls{opacity:.6}}small{display:block;padding:14px;color:#abc5a9}</style></head><body><header><h1>🏹 ARROW ARENA</h1><p>THREE ARCHERS. ONE WINNER. REAL PLAYERS OR BOTS.</p></header><div class="bar"><label>ROOM <input id="room" maxlength="12" size="10"></label><button id="join">JOIN GAME</button><button id="copy">COPY INVITE LINK</button></div><div id="status">Join a room to begin.</div><div id="score"></div><canvas id="game" width="900" height="560"></canvas><div class="controls"><div class="pad"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button class="down" data-key="s">▼</button><button class="right" data-key="d">▶</button></div><button id="shoot">SHOOT ➶</button></div><small>WASD / ARROW KEYS = MOVE · MOUSE = AIM · CLICK / SPACE = SHOOT · MOBILE = TOUCH CONTROLS</small><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
